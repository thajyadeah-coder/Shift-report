<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift Report — Suivi des ventes et commissions</title>
<style>
:root{--bg:#eef1f4;--ink:#1b2430;--mute:#5d6b7a;--line:#d3dae1;--acc:#1f6f5c;--acc2:#6fd3b9;--card:#fff;--err:#b3261e;--warn:#c77700}
@media(prefers-color-scheme:dark){:root{--bg:#141a20;--ink:#e6ebf0;--mute:#93a1b0;--line:#2c3742;--acc:#4fb79e;--acc2:#2f8f78;--card:#1c242c;--err:#ff8a80;--warn:#f0b24a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;gap:10px;align-items:center}.brand small{display:block;color:var(--mute);font-size:13px}
.logo{background:var(--acc);color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-weight:700}
h1{font-size:21px;margin:0;line-height:1.2}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.05)}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}tfoot td{font-weight:700}
td small{display:block;color:var(--mute);white-space:normal;max-width:240px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tot{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}.tot div span{display:block;color:var(--mute);font-size:13px}.tot b{font-size:18px}
.msg{color:var(--err);margin-top:8px}.ok{color:var(--acc);margin-top:8px}.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
.auth{max-width:360px;margin:8vh auto}.auth input{width:100%;margin-bottom:8px}
.hello{margin:10px 0 6px}.hello b{color:var(--acc)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.nav button{border-radius:999px;padding:7px 16px}
.nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tiles div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tiles span{display:block;color:var(--mute);font-size:13px}.tiles b{font-size:20px}
.tiles .k{border-left:4px solid var(--acc)}
.up{color:var(--acc)!important}.down{color:var(--err)!important}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.g2 .card{margin:0}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mute);font-size:11px}.chart .v{fill:var(--ink);font-weight:600}
.chart .bar{fill:var(--acc);opacity:.45}.chart .bar.cur{opacity:1}.chart .grid{stroke:var(--line)}
.hb{display:grid;grid-template-columns:minmax(70px,130px) 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.hb a,.hb span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);text-decoration:none}
.hb i{display:block;height:10px;border-radius:5px;background:var(--line)}
.hb i u{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.hb em{font-style:normal;font-weight:600;font-size:13px}
.day{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;text-transform:capitalize;font-weight:600}
.dh b{color:var(--acc)}
.ln,.lh{display:grid;grid-template-columns:2fr 1fr 2fr 40px;gap:8px;margin-bottom:6px}
.ln.nd,.lh.nd{grid-template-columns:2fr 1fr 40px}
.ln input,.ln select{min-width:0;width:100%}.ln button{padding:8px 0}
.lh{color:var(--mute);font-size:13px;font-weight:600;margin-bottom:8px}
.bd{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(31,111,92,.15);color:var(--acc)}.bd.off{background:rgba(150,150,150,.2);color:var(--mute)}
.bd.warn{background:rgba(199,119,0,.15);color:var(--warn)}
.tiles .bd{display:inline-block;font-size:12px;color:var(--acc)}.tiles .bd.warn{color:var(--warn)}
.pg{display:block;height:10px;border-radius:5px;background:var(--line);min-width:90px;margin:6px 0}
.pg u{display:block;height:100%;border-radius:5px;background:var(--warn)}.pg.ok u{background:var(--acc)}
.mm label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:13px}
@media(max-width:760px){.g2{grid-template-columns:1fr}.lh{display:none}
.ln,.ln.nd{grid-template-columns:1fr 1fr 40px}.ln button{order:3}.ln .d{order:4;grid-column:1/-1}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== Configuration =====
const SUPABASE_URL = 'https://gnhvvhjnfsetopbekqcp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TTbtSYdZF5PXJIAZiwsAkQ_3CcoAzIw';
const AR_MULT = 3900;
// =========================
let recovering = /type=recovery/.test(location.hash);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const sb2 = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'sr-tmp'}
});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monday = d => { const x = new Date(d); x.setDate(x.getDate() - (x.getDay()+6)%7); x.setHours(0,0,0,0); return x; };
const fmt = n => (Math.round(n*100)/100).toLocaleString('fr-FR');
const num = v => Number(String(v ?? '').replace(/[\s\u00a0\u202f]/g,'').replace(',','.'));
const pv = c => Math.round(Number(c||0)*1e6)/1e4;
const pct = c => pv(c).toLocaleString('fr-FR') + ' %';
const rateOpts = v => {
  const l = [...Array(20)].map((_,i)=>i+1);
  if(v!=null && !l.includes(v)) l.push(v);
  return l.sort((a,b)=>a-b).map(n=>`<option value="${n}" ${n===v?'selected':''}>${n.toLocaleString('fr-FR')} %</option>`).join('');
};
const dayName = d => d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'2-digit'});
const dayShort = d => d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'});
const STAT_WEEKS = 8;
const MM_OPS = ['MVola','Orange Money','Airtel Money'];
let HAS_DETAIL = true; // passe à false si la colonne « detail » n'existe pas encore dans Supabase
const wk = (day,h) => Math.floor((new Date(day+'T00:00:00')-h+36e5)/(7*864e5));
const evoOf = (c,p) => p>0 ? Math.round((c-p)/p*100) : null;
const evoTxt = e => e===null ? '—' : (e>0?'+':'')+e+' %';
const evoCls = e => e===null ? '' : e>=0 ? 'up' : 'down';

const mmRow = r => r && ({userId:r.user_id,operator:r.operator,number:r.number,holder:r.holder,updatedAt:r.updated_at});

async function mmApi(method, q, body){
  if(method === 'GET'){
    const uid = q ? new URLSearchParams(q).get('user_id') : null;
    let req = sb.from('mobile_money').select('*');
    if(uid) req = req.eq('user_id', uid);
    const {data,error} = await req;
    if(error) throw new Error(error.message);
    return uid ? mmRow(data[0]) || null : data.map(mmRow);
  }
  const {data:{session}} = await sb.auth.getSession();
  const number = String(body.number||'').trim().slice(0,30);
  if(number && !/^\+?[0-9 ]{6,20}$/.test(number))
    throw new Error('Numéro invalide : chiffres uniquement, le signe + est autorisé.');
  const row = {
    user_id:body.user_id || session?.user?.id,
    operator:String(body.operator||'').trim().slice(0,40),
    number,
    holder:String(body.holder||'').trim().slice(0,80),
    updated_at:new Date().toISOString()
  };
  const {data,error} = await sb.from('mobile_money').upsert(row,{onConflict:'user_id'}).select().single();
  if(error) throw new Error(error.message);
  return mmRow(data);
}

// Saisie : une ligne = un modèle, un chiffre d'affaires, un détail facultatif
// Liste officielle des modèles (gérée par l'admin, onglet Objectifs) : les agents ne font que choisir
let MODEL_NAMES = [];
function modelOpts(cur){
  const c=String(cur||'').trim(), k=c.toLocaleLowerCase('fr');
  const found=MODEL_NAMES.find(n=>n.trim().toLocaleLowerCase('fr')===k);
  const sel=found||c; // une ancienne saisie hors liste reste visible pour ne pas être perdue
  let h=`<option value=""${sel?'':' selected'}>Choisir un modèle</option>`;
  h+=MODEL_NAMES.map(n=>`<option value="${esc(n)}"${n===sel?' selected':''}>${esc(n)}</option>`).join('');
  if(c && !found) h+=`<option value="${esc(c)}" selected>${esc(c)} (hors liste)</option>`;
  return h;
}
const lineHtml = (m={}) => `<div class="ln${HAS_DETAIL?'':' nd'}">
  <select class="m" aria-label="Modèle" onchange="calc()">${modelOpts(m.model_name)}</select>
  <input class="c" inputmode="decimal" placeholder="CA" aria-label="Chiffre d'affaires" value="${m.ca ?? ''}" oninput="calc()">
  ${HAS_DETAIL?`<input class="d" maxlength="200" placeholder="Détail (facultatif)" aria-label="Détail" value="${esc(m.detail)}">`:''}
  <button type="button" onclick="delLine(this)" aria-label="Supprimer la ligne" title="Supprimer">✕</button></div>`;

function addLine(k){
  const box=$('ln_'+k);
  box.insertAdjacentHTML('beforeend',lineHtml());
  box.lastElementChild.querySelector('.m').focus();
}
function delLine(b){ b.parentElement.remove(); calc(); }

function readDay(k){
  const byName = new Map();
  $('ln_'+k).querySelectorAll('.ln').forEach(r=>{
    const name=r.querySelector('.m').value.trim(), raw=r.querySelector('.c').value.trim();
    const det=r.querySelector('.d') ? r.querySelector('.d').value.trim() : '';
    if(!name && !raw && !det) return;
    if(!name) throw new Error('indiquez le modèle pour chaque ligne renseignée.');
    const ca=num(raw);
    if(!raw || !Number.isFinite(ca) || ca<0) throw new Error(`le chiffre d'affaires de « ${name} » doit être un nombre positif.`);
    const key=name.toLocaleLowerCase('fr'), cur=byName.get(key);
    if(cur){ cur.ca+=ca; if(det) cur.detail=cur.detail?cur.detail+' ; '+det:det; }
    else byName.set(key,{model_name:name,ca,detail:det});
  });
  return [...byName.values()];
}

// Toutes les lignes de la période (pagination : Supabase limite à 1000 lignes par requête)
async function allEntries(from,to,uid){
  let out=[],i=0;
  for(;;){
    let q=sb.from('model_entries').select('user_id,day,model_name,ca'+(HAS_DETAIL?',detail':''))
      .gte('day',from).lte('day',to).order('day').order('user_id').order('model_name').range(i,i+999);
    if(uid) q=q.eq('user_id',uid);
    const {data,error}=await q;
    if(error){
      if(HAS_DETAIL && /detail/i.test(error.message)){ HAS_DETAIL=false; out=[]; i=0; continue; }
      throw error;
    }
    out=out.concat(data||[]);
    if(!data||data.length<1000) return out;
    i+=1000;
  }
}

const ACTIVE_DAYS = 7; // un agent est « Actif » s'il a saisi son CA durant les 7 derniers jours
function badge(last){
  const age = last ? Math.floor((new Date(iso(new Date())+'T00:00:00') - new Date(last+'T00:00:00'))/864e5) : null;
  const on = age !== null && age <= ACTIVE_DAYS;
  return `<span class="bd${on?'':' off'}">${on?'● Actif':'● Inactif'}</span><small>${last?'Dernière saisie : '+new Date(last+'T00:00:00').toLocaleDateString('fr-FR'):'Aucune saisie'}</small>`;
}
function copyTxt(b){
  const o=b.textContent;
  (navigator.clipboard?navigator.clipboard.writeText(b.dataset.t):Promise.reject()).then(()=>{ b.textContent='Copié ✓'; setTimeout(()=>b.textContent=o,1500); }).catch(()=>{});
}
async function resetPw(b){
  const em=b.dataset.t;
  if(!confirm('Envoyer un lien de réinitialisation du mot de passe à '+em+' ?')) return;
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(!error) await sb.from('agent_credentials').delete().eq('user_id',b.dataset.u);
  b.textContent=error?'Échec : '+error.message:'Lien envoyé ✓';
}
async function noteCred(b){
  const uid=b.dataset.u, pw=$('cr_'+uid).value.trim();
  if(!pw) return;
  const {error}=await sb.from('agent_credentials').upsert({user_id:uid,email:b.dataset.t,password:pw,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error) return alert('Erreur : '+error.message);
  show();
}
function recoveryView(){
  recovering=true;
  $('app').innerHTML=`<div class="card auth"><div class="brand" style="margin-bottom:12px"><span class="logo">SR</span><div><h1>Shift Report</h1><small>Suivi des ventes et des commissions</small></div></div>
  <p style="color:var(--mute)">Choisissez votre nouveau mot de passe.</p>
  <input id="np" type="password" placeholder="Nouveau mot de passe (6 caractères minimum)" autocomplete="new-password">
  <input id="np2" type="password" placeholder="Confirmez le mot de passe" autocomplete="new-password">
  <div class="row"><button class="p" onclick="setPw()">Enregistrer le mot de passe</button></div><div class="msg" id="am"></div></div>`;
}
async function setPw(){
  const a=$('np').value, b=$('np2').value, am=$('am');
  if(a.length<6) return am.textContent='6 caractères minimum.';
  if(a!==b) return am.textContent='Les deux mots de passe ne correspondent pas.';
  const {error}=await sb.auth.updateUser({password:a});
  if(error) return am.textContent='Échec : '+error.message;
  recovering=false; history.replaceState(null,'',location.pathname); start();
}
sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY') recoveryView(); });

let lastRefresh = new Date();
const pbar = (v,g) => `<i class="pg${g>0&&v>=g?' ok':''}"><u style="width:${g>0?Math.min(100,v/g*100):0}%"></u></i>`;
const stBadge = (v,g) => g>0&&v>=g ? '<span class="bd">✔ Atteint</span>' : `<span class="bd warn">En cours · reste ${fmt(Math.max(g-v,0))}</span>`;
const mkey = n => String(n).trim().toLocaleLowerCase('fr');
// Objectifs de l'agence fixés jour par jour (table agency_goals : day, amount)
let agMap={}, agOk=true;
const hasAg = k => Object.prototype.hasOwnProperty.call(agMap,k);
function objData(goals,rows,todayRows){
  const from=iso(days[0]),to=iso(days[6]),today=iso(new Date());
  const wk={},td={},dayCA={}; let wTot=0,tTot=0,doneCA=0;
  rows.forEach(r=>{ if(r.day<from||r.day>to) return; const ca=Number(r.ca||0); wTot+=ca; dayCA[r.day]=(dayCA[r.day]||0)+ca; if(r.day<today) doneCA+=ca; wk[mkey(r.model_name)]=(wk[mkey(r.model_name)]||0)+ca; });
  todayRows.forEach(r=>{ const ca=Number(r.ca||0); tTot+=ca; td[mkey(r.model_name)]=(td[mkey(r.model_name)]||0)+ca; });
  // Valeur par défaut d'un jour sans objectif fixé : somme des objectifs des modèles
  const base=goals.reduce((s,g)=>s+Number(g.daily_goal||0),0);
  const goalOf=k=>hasAg(k)?agMap[k]:base;
  const dayGoal=goalOf(today);
  const weekGoal=days.reduce((s,d)=>s+goalOf(iso(d)),0);
  const doneGoal=days.reduce((s,d)=>iso(d)<today?s+goalOf(iso(d)):s,0);
  return {wk,td,dayCA,wTot,tTot,doneCA,base,goalOf,dayGoal,weekGoal,doneGoal,todaySet:hasAg(today)};
}
function catchUp(o){
  if(!o.weekGoal) return '';
  const today=iso(new Date());
  const done=days.filter(d=>iso(d)<today).length, rem=days.filter(d=>iso(d)>=today).length;
  const gap=o.doneGoal-o.doneCA, left=Math.max(o.weekGoal-o.wTot,0), need=rem>0?left/rem:null, late=gap>0;
  const msg = left===0 ? '✔ L\'objectif hebdomadaire de l\'agence est atteint.'
    : rem===0 ? `Semaine terminée : ${fmt(left)} d'objectif n'ont pas été réalisés.`
    : `Pour atteindre l'objectif de la semaine, il faut réaliser ${fmt(left)} sur les ${rem} jour${rem>1?'s':''} restant${rem>1?'s':''}, soit ${fmt(need)} par jour (aujourd'hui inclus).`;
  return `<div class="card"><h2>Rattrapage de la semaine</h2>
  <div class="tiles" style="margin-bottom:8px">
    <div class="k"><span>${late?'Retard à rattraper':'Avance'} (jours terminés)</span><b class="${late?'down':'up'}">${fmt(Math.abs(gap))}</b><span>Objectif cumulé des ${done} jour${done>1?'s':''} terminé${done>1?'s':''} : ${fmt(o.doneGoal)}</span></div>
    <div class="k"><span>Reste à réaliser (semaine)</span><b>${fmt(left)}</b>${pbar(o.wTot,o.weekGoal)}</div>
    <div class="k"><span>Jours restants</span><b>${rem}</b></div>
    <div class="k"><span>CA nécessaire / jour</span><b>${need===null?'—':fmt(need)}</b><span>objectif d'aujourd'hui : ${fmt(o.dayGoal)}</span></div>
  </div>
  <p class="hint" style="margin:0">${msg}</p></div>`;
}
function objTiles(o){
  return `<div class="tiles">
    <div class="k"><span>Objectif agence — aujourd'hui</span><b>${fmt(o.dayGoal)}</b><span>${o.todaySet?'Fixé pour aujourd\'hui':'Par défaut (somme des modèles)'}</span></div>
    <div class="k"><span>CA d'aujourd'hui</span><b>${fmt(o.tTot)}</b>${pbar(o.tTot,o.dayGoal)}${stBadge(o.tTot,o.dayGoal)}</div>
    <div class="k"><span>Objectif agence — semaine</span><b>${fmt(o.weekGoal)}</b><span>Somme des 7 objectifs journaliers</span></div>
    <div class="k"><span>CA de la semaine affichée</span><b>${fmt(o.wTot)}</b>${pbar(o.wTot,o.weekGoal)}${stBadge(o.wTot,o.weekGoal)}</div>
  </div>
  ${catchUp(o)}
  <p class="hint">Actualisation automatique toutes les 30 secondes · dernière mise à jour à ${lastRefresh.toLocaleTimeString('fr-FR')}</p>`;
}
function objSummary(goals,rows,tr){
  if(goals===null) return '';
  const o=objData(goals,rows,tr);
  return (o.dayGoal||o.weekGoal) ? objTiles(o) : '<p class="hint">Aucun objectif défini : fixez l\'objectif de l\'agence du jour dans l\'onglet Objectifs.</p>';
}
function agencyCard(o){
  if(!agOk) return `<div class="card"><h2>Objectif de l'agence — jour par jour</h2><p class="msg">Table « agency_goals » absente : exécutez le SQL fourni dans Supabase pour activer l'objectif journalier de l'agence.</p></div>`;
  const today=iso(new Date());
  const trs=days.map(d=>{
    const k=iso(d), g=o.goalOf(k), ca=o.dayCA[k]||0;
    const st = g<=0 ? '—' : k>today ? '<span class="bd off">À venir</span>'
      : (k<today && ca<g) ? `<span class="bd warn">Non atteint · manque ${fmt(g-ca)}</span>` : stBadge(ca,g);
    return `<tr${k===today?' style="font-weight:600"':''}><td style="text-transform:capitalize">${dayName(d)}${k===today?' · aujourd\'hui':''}</td>
      <td><input type="text" inputmode="decimal" style="width:110px" value="${hasAg(k)?agMap[k]:''}" placeholder="${o.base?fmt(o.base):'0'}" onchange="setAgencyGoal('${k}',this.value)" aria-label="Objectif de l'agence du ${k}"></td>
      <td>${fmt(ca)}</td><td style="min-width:130px">${g>0?pbar(ca,g):''}</td><td>${st}</td></tr>`;
  }).join('');
  return `<div class="card mm"><h2>Objectif de l'agence — jour par jour</h2>
  <p class="hint">Fixez l'objectif de l'agence pour chaque jour de la semaine affichée. Un jour laissé vide utilise la valeur par défaut (${o.base?fmt(o.base)+', somme des objectifs des modèles':'aucune, tant que les modèles n\'ont pas d\'objectif'}). L'objectif de la semaine est la somme des 7 jours.</p>
  <div class="row" style="align-items:flex-end;margin-bottom:12px">
    <label>Même objectif pour les 7 jours<input id="ag_all" inputmode="decimal" placeholder="Ex. 1500"></label>
    <button class="p" onclick="fillAgencyWeek()">Appliquer à la semaine</button></div>
  <div id="ag_msg" class="msg"></div>
  <table><tr><th>Jour</th><th>Objectif agence</th><th>CA réalisé</th><th>Progression</th><th>Statut</th></tr>${trs}
  <tfoot><tr><td>Semaine</td><td>${fmt(o.weekGoal)}</td><td>${fmt(o.wTot)}</td><td style="min-width:130px">${pbar(o.wTot,o.weekGoal)}</td><td>${o.weekGoal?stBadge(o.wTot,o.weekGoal):'—'}</td></tr></tfoot></table></div>`;
}
async function setAgencyGoal(day,v){
  const raw=String(v).trim();
  if(raw===''){
    const {error}=await sb.from('agency_goals').delete().eq('day',day);
    if(error) alert('Erreur : '+error.message);
    return show();
  }
  const g=num(raw);
  if(!Number.isFinite(g)||g<0) return show();
  const {error}=await sb.from('agency_goals').upsert({day,amount:g,updated_at:new Date().toISOString()},{onConflict:'day'});
  if(error) alert('Erreur : '+error.message);
  show();
}
async function fillAgencyWeek(){
  const raw=$('ag_all').value.trim(), g=num(raw), m=$('ag_msg');
  if(!raw||!Number.isFinite(g)||g<0) return m.textContent='Indiquez un objectif valide (nombre positif).';
  const now=new Date().toISOString();
  const {error}=await sb.from('agency_goals').upsert(days.map(d=>({day:iso(d),amount:g,updated_at:now})),{onConflict:'day'});
  if(error) return m.textContent='Erreur : '+error.message;
  show();
}
const frDate = d => new Date(d+'T00:00:00').toLocaleDateString('fr-FR');
function cuProgress(cu,ca){
  const amt=Number(cu.amount||0), left=Math.max(amt-ca,0), today=iso(new Date());
  const rem=cu.end_day?Math.max(Math.round((new Date(cu.end_day+'T00:00:00')-new Date(today+'T00:00:00'))/864e5)+1,0):null;
  const need=rem>0?left/rem:null;
  const msg = left===0 ? '✔ L\'objectif à rattraper est atteint.'
    : cu.end_day && rem===0 ? `Date limite dépassée : ${fmt(left)} restent à rattraper.`
    : cu.end_day ? `Il reste ${fmt(left)} à rattraper en ${rem} jour${rem>1?'s':''}, soit ${fmt(need)} par jour (aujourd'hui inclus).`
    : `Il reste ${fmt(left)} à rattraper.`;
  return `<div class="card"><h2>Objectif général à rattraper</h2>
  <div class="tiles" style="margin-bottom:8px">
    <div class="k"><span>Objectif à rattraper</span><b>${fmt(amt)}</b><span>CA compté depuis le ${frDate(cu.start_day)}</span></div>
    <div class="k"><span>CA réalisé</span><b>${fmt(ca)}</b>${pbar(ca,amt)}${stBadge(ca,amt)}</div>
    <div class="k"><span>Reste à rattraper</span><b>${fmt(left)}</b></div>
    ${cu.end_day?`<div class="k"><span>Jours restants</span><b>${rem}</b><span>jusqu'au ${frDate(cu.end_day)}</span></div><div class="k"><span>CA nécessaire / jour</span><b>${need===null?'—':fmt(need)}</b></div>`:''}
  </div><p class="hint" style="margin:0">${msg}</p></div>`;
}
function cuCard(cu,ok,ca){
  if(!ok) return `<div class="card"><h2>Objectif général de l'agence à rattraper</h2><p class="msg">Table « settings » absente : exécutez le SQL fourni dans Supabase pour activer cette fonction.</p></div>`;
  return `<div class="card mm"><h2>Objectif général de l'agence à rattraper</h2>
  <p class="hint">Saisissez le montant de CA que l'agence doit rattraper. Le suivi compte le CA réalisé à partir de la date de départ et se met à jour automatiquement.</p>
  <div class="row" style="align-items:flex-end">

async function saveCU(){
  const raw=$('cu_a').value.trim(), amt=num(raw), st=$('cu_s').value, en=$('cu_e').value||null, m=$('cu_msg');
  m.className='msg';
  if(!raw||!Number.isFinite(amt)||amt<=0) return m.textContent='Indiquez un montant à rattraper valide (nombre positif).';
  if(!st) return m.textContent='Indiquez la date de départ.';
  if(en&&en<st) return m.textContent='La date limite doit être postérieure à la date de départ.';
  const {error}=await sb.from('settings').upsert({key:'catchup',amount:amt,start_day:st,end_day:en,updated_at:new Date().toISOString()},{onConflict:'key'});
  if(error) return m.textContent='Erreur : '+error.message;
  show();
}
async function delCU(){
  if(!confirm('Réinitialiser l\'objectif à rattraper ?')) return;
  const {error}=await sb.from('settings').delete().eq('key','catchup');
  if(error) alert('Erreur : '+error.message);
  show();
}
async function addModel(){
  const typed=$('md_nm').value.replace(/\s+/g,' ').trim(), raw=$('md_g').value.trim(), g=num(raw), m=$('md_msg');
  // un nom déjà existant (même en minuscules/majuscules) met à jour le modèle existant au lieu d'en créer un second
  const nm=MODEL_NAMES.find(n=>mkey(n)===mkey(typed))||typed;
  m.className='msg';

  if(!raw||!Number.isFinite(g)||g<0) return m.textContent='Indiquez un objectif journalier valide (nombre positif).';
  const {error}=await sb.from('models').upsert({name:nm,daily_goal:g},{onConflict:'name'});
  if(error) return m.textContent='Erreur : '+error.message;
  notice='Modèle « '+nm+' » enregistré.'; show();
}
async function setGoal(id,v){
  const g=num(v);
  if(String(v).trim()===''||!Number.isFinite(g)||g<0) return show();
  const {error}=await sb.from('models').update({daily_goal:g}).eq('id',id);

async function delModel(b){
  if(!confirm('Retirer le modèle « '+b.dataset.n+' » des objectifs ? Les saisies déjà enregistrées ne sont pas supprimées.')) return;
  const {error}=await sb.from('models').delete().eq('id',b.dataset.id);
  if(error) alert('Erreur : '+error.message);
  show();
}

let me = null, viewId = null, tab = null, weekStart = monday(new Date()), days = [], notice = '';

async function login(){
  const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error) $('am').textContent = 'Connexion impossible : ' + error.message;
  else start();
}

async function signup(){
  const nm=$('nm').value.trim(), em=$('em').value.trim(), pw=$('pw').value, am=$('am');
  if(!nm||!em||pw.length<6) return am.textContent = 'Veuillez renseigner votre nom, votre email et un mot de passe de 6 caractères minimum.';
  if($('pw2') && $('pw2').value !== pw) return am.textContent = 'Les deux mots de passe ne correspondent pas.';
  const {data,error} = await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});
  if(error) return am.textContent = 'Inscription impossible : ' + error.message;
  if(data.user && data.user.identities && data.user.identities.length===0)
    return am.textContent = 'Cette adresse email est déjà utilisée. Veuillez vous connecter.';
  if(!data.session) authView('<span class="ok">Compte créé. Confirmez votre adresse email via le lien reçu, puis connectez-vous.</span>','login');
  else start();
}

async function logout(){
  await sb.auth.signOut();
  me = null; viewId = null; tab = null; authView();
}

async function start(){
  if(recovering) return recoveryView();
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return authView();
  const {data,error} = await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!data) return authView(esc('Profil introuvable : ' + (error?error.message:'')));
  me = data; viewId = viewId || me.id;
  tab = tab || (me.role==='admin' ? 'dash' : 'reports');
  show();
}

function shift(n){ weekStart.setDate(weekStart.getDate()+n*7); show(); }

function pick(id){ viewId = id; tab = 'agent'; show(); }
function setTab(t){ tab = t; show(); }

// ---------- Graphiques ----------
function bars(items,label){
  const W=640,H=200,pl=8,pr=8,pt=22,pb=28,max=Math.max(...items.map(i=>i.v),1);
  const bw=(W-pl-pr)/items.length, ih=H-pt-pb;
  const g=items.map((it,i)=>{
    const h=it.v/max*ih, x=pl+i*bw+bw*.18, y=pt+ih-h;
    return `<g><title>${esc(it.t||it.l)} : ${fmt(it.v)}</title>
    <rect class="bar${it.cur?' cur':''}" x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,it.v>0?2:0)}" rx="3"></rect>
    ${it.v>0?`<text class="v" x="${x+bw*.32}" y="${y-6}" text-anchor="middle">${fmt(it.v)}</text>`:''}
    <text x="${x+bw*.32}" y="${H-10}" text-anchor="middle">${esc(it.l)}</text></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
  <line class="grid" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"></line>${g}</svg>`;
}

function hbars(items,empty){
  if(!items.length) return `<p class="hint">${empty}</p>`;
  const max=Math.max(...items.map(i=>i.v),1);
  return items.map(it=>`<div class="hb">
    ${it.id?`<a href="#" onclick="pick('${it.id}');return false" title="Ouvrir le tableau de bord">${esc(it.l)}</a>`:`<span class="n">${esc(it.l)}</span>`}
    <i><u style="width:${Math.max(it.v/max*100,2)}%"></u></i><em>${esc(it.r)}</em></div>`).join('');
}

function weekSeries(rows,hStart){
  const weeks=[...Array(STAT_WEEKS)].map((_,i)=>{
    const d=new Date(hStart); d.setDate(d.getDate()+i*7); return {d,ca:0};
  });
  rows.forEach(r=>{ const w=weeks[wk(r.day,hStart)]; if(w) w.ca+=Number(r.ca||0); });
  return weeks;
}
const weekItems = weeks => weeks.map((w,i)=>({
  l:w.d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}),v:w.ca,cur:i===weeks.length-1,
  t:'Semaine du '+w.d.toLocaleDateString('fr-FR')
}));

// ---------- Tableau de bord général (admin) ----------
function dashCard(profiles,rows,hStart){
  const from=iso(days[0]),to=iso(days[6]);
  const weeks=weekSeries(rows,hStart);
  const cur={},models={},dayT={};
  rows.forEach(r=>{
    if(r.day<from||r.day>to) return;
    const ca=Number(r.ca||0);
    cur[r.user_id]=(cur[r.user_id]||0)+ca;
    dayT[r.day]=(dayT[r.day]||0)+ca;
    const k=String(r.model_name).trim().toLocaleLowerCase('fr');
    const m=models[k]=models[k]||{n:r.model_name,ca:0};
    m.ca+=ca;
  });
  const ag=profiles.map(p=>({p,ca:cur[p.id]||0})).sort((a,b)=>b.ca-a.ca);
  const tca=ag.reduce((s,a)=>s+a.ca,0);
  const tco=ag.reduce((s,a)=>s+a.ca*a.p.commission,0);
  const act=ag.filter(a=>a.ca>0).length;
  const evo=evoOf(weeks[STAT_WEEKS-1].ca,weeks[STAT_WEEKS-2].ca);
  const today=iso(new Date());
  const top=Object.values(models).sort((a,b)=>b.ca-a.ca).slice(0,6);

  return `<div class="tiles">
    <div class="k"><span>Chiffre d'affaires</span><b>${fmt(tca)}</b><span class="${evoCls(evo)}">${evoTxt(evo)} vs semaine précédente</span></div>
    <div class="k"><span>Commissions à verser</span><b>${fmt(tco)}</b></div>
    <div class="k"><span>Commissions (Ar)</span><b>${fmt(tco*AR_MULT)}</b></div>
    <div class="k"><span>Agents actifs</span><b>${act} / ${profiles.length}</b></div>
    <div class="k"><span>CA moyen par agent actif</span><b>${fmt(act?tca/act:0)}</b></div>
  </div>
  <div class="g2">
    <div class="card"><h2>Chiffre d'affaires de l'équipe par semaine</h2><p class="hint">Évolution sur les ${STAT_WEEKS} dernières semaines, jusqu'à la semaine affichée.</p>${bars(weekItems(weeks),'CA de l\'équipe par semaine')}</div>
    <div class="card"><h2>Répartition par jour</h2><p class="hint">Total de tous les agents sur la semaine affichée.</p>
      ${bars(days.map(d=>({l:d.toLocaleDateString('fr-FR',{weekday:'short'}),t:dayShort(d),v:dayT[iso(d)]||0,cur:iso(d)===today})),'CA de l\'équipe par jour')}</div>
  </div>
  <div class="g2">
    <div class="card"><h2>Classement des agents</h2><p class="hint">Cliquez sur un agent pour ouvrir son tableau de bord.</p>
      ${hbars(ag.filter(a=>a.ca>0).map(a=>({id:a.p.id,l:a.p.full_name||a.p.email,v:a.ca,r:`${fmt(a.ca)} · ${Math.round(a.ca/tca*100)} %`})),'Aucune activité enregistrée cette semaine.')}</div>
    <div class="card"><h2>Modèles les plus performants</h2><p class="hint">Les 6 premiers de la semaine, par chiffre d'affaires.</p>
      ${hbars(top.map(m=>({l:m.n,v:m.ca,r:fmt(m.ca)})),'Aucune activité enregistrée cette semaine.')}</div>
  </div>`;
}

function agentView(vu,profiles,hist,hStart,mm,lastBy){
  const from=iso(days[0]),to=iso(days[6]),today=iso(new Date());
  const dayT={},models={};
  hist.forEach(r=>{
    if(r.day<from||r.day>to) return;
    const ca=Number(r.ca||0);
    dayT[r.day]=(dayT[r.day]||0)+ca;
    const k=String(r.model_name).trim().toLocaleLowerCase('fr');
    (models[k]=models[k]||{n:r.model_name,ca:0}).ca+=ca;
  });
  const ca=days.reduce((s,d)=>s+(dayT[iso(d)]||0),0), co=ca*vu.commission;
  const top=Object.values(models).sort((a,b)=>b.ca-a.ca).slice(0,6);
  const m=mm||{};
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Tableau de bord — ${esc(vu.full_name||vu.email)}</h2>
  <select onchange="pick(this.value)" aria-label="Choisir un agent">${profiles.filter(p=>p.role!=='admin').map(p=>`<option value="${p.id}" ${p.id===vu.id?'selected':''}>${esc(p.full_name||p.email)}</option>`).join('')}</select></div>
  <p class="hint" style="margin:8px 0 0">${badge(lastBy[vu.id])} · ${esc(vu.email)} · Mobile Money : ${m.number?esc([m.operator,m.number,m.holder].filter(Boolean).join(' · ')):'non renseigné'}</p></div>
  <div class="tiles">
    <div class="k"><span>CA de la semaine</span><b>${fmt(ca)}</b></div>
    <div class="k"><span>Taux de commission</span><b>${pct(vu.commission)}</b></div>
    <div class="k"><span>Commission</span><b>${fmt(co)}</b></div>
    <div class="k"><span>Commission (Ar)</span><b>${fmt(co*AR_MULT)}</b></div>
  </div>
  <div class="g2">
    <div class="card"><h2>CA par jour</h2><p class="hint">Semaine affichée.</p>${bars(days.map(d=>({l:d.toLocaleDateString('fr-FR',{weekday:'short'}),t:dayShort(d),v:dayT[iso(d)]||0,cur:iso(d)===today})),'CA par jour')}</div>
    <div class="card"><h2>Modèles les plus vendus</h2><p class="hint">Les 6 premiers de la semaine.</p>${hbars(top.map(x=>({l:x.n,v:x.ca,r:fmt(x.ca)})),'Aucune activité enregistrée cette semaine.')}</div>
  </div>`;
}

async function show(){
  if(recovering) return;
  days = [...Array(7)].map((_,i)=>{
    const d=new Date(weekStart); d.setDate(d.getDate()+i); return d;
  });
  const from=iso(days[0]), to=iso(days[6]), admin=me.role==='admin';
  const t=admin?tab:'reports';
  const hStart=new Date(weekStart);
  hStart.setDate(hStart.getDate()-(STAT_WEEKS-1)*7);
  let profiles=[me], rows=[], lastBy={};

  try{
    if(admin){
      const [p,e,l]=await Promise.all([
        sb.from('profiles').select('*').order('full_name'),
        allEntries(iso(hStart),to),
        sb.from('model_entries').select('user_id,day').order('day',{ascending:false}).limit(1000)
      ]);
      profiles=p.data||[me]; rows=e;
      (l.data||[]).forEach(r=>{ if(!lastBy[r.user_id]) lastBy[r.user_id]=r.day; });
    }else rows=await allEntries(iso(hStart),to,me.id);
  }catch(err){
    $('app').innerHTML=`<div class="card"><div class="msg">Chargement impossible : ${esc(err.message)}</div><button onclick="show()">Réessayer</button></div>`;
    return;
  }

  const [md,tr]=await Promise.all([
    sb.from('models').select('*').order('name'),
    admin ? allEntries(iso(new Date()),iso(new Date())).catch(()=>[]) : Promise.resolve([])
  ]);
  const goals=md.error?null:(md.data||[]);
  MODEL_NAMES=(goals||[]).map(g=>String(g.name).trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));
  agMap={}; agOk=true;
  if(admin && (t==='dash'||t==='goals')){
    const td0=iso(new Date()), lo=td0<from?td0:from, hi=td0>to?td0:to;
    const a=await sb.from('agency_goals').select('day,amount').gte('day',lo).lte('day',hi);
    if(a.error) agOk=false; else (a.data||[]).forEach(r=>{ agMap[r.day]=Number(r.amount); });
  }
  let cu=null, cuOk=true, cuCA=0;
  if(admin && (t==='dash'||t==='goals')){
    const c=await sb.from('settings').select('*').eq('key','catchup').maybeSingle();
    if(c.error) cuOk=false;
    else if(c.data){
      cu=c.data;
      const rr=await allEntries(cu.start_day,iso(new Date())).catch(()=>[]);
      cuCA=rr.reduce((s,r)=>s+Number(r.ca||0),0);
    }
  }
  if(!admin || !profiles.find(p=>p.id===viewId)) viewId=me.id;
  if(admin&&t==='agent'){
    const ags=profiles.filter(p=>p.role!=='admin');
    if(!ags.find(p=>p.id===viewId)&&ags[0]) viewId=ags[0].id;
  }
  const vu=profiles.find(p=>p.id===viewId)||me;
  const hist=rows.filter(r=>r.user_id===vu.id);

  const [mmAll,mmOne]=await Promise.all([
    admin ? mmApi('GET').catch(()=>[]) : Promise.resolve([]),
    mmApi('GET','?user_id='+encodeURIComponent(vu.id)).catch(()=>null)
  ]);
  const mmBy={};
  (mmAll||[]).forEach(m=>{mmBy[m.userId]=m;});

  const byU={};
  rows.forEach(r=>{
    if(r.day<from||r.day>to) return;
    const u=byU[r.user_id]=byU[r.user_id]||{};
    const day=u[r.day]=u[r.day]||{ca:0,models:[]};
    const ca=Number(r.ca||0);
    day.ca+=ca;
    day.models.push({model_name:r.model_name,ca,detail:r.detail||''});
  });
  const mine=byU[vu.id]||{};

  let credBy={}, credOk=true;
  if(admin && t==='access'){
    const c=await sb.from('agent_credentials').select('user_id,password');
    if(c.error) credOk=false; else (c.data||[]).forEach(r=>{ credBy[r.user_id]=r.password; });
  }
  let dash='', team='', access='';
  if(admin && t==='dash') dash=(cu?cuProgress(cu,cuCA):'')+objSummary(goals,rows,tr)+dashCard(profiles,rows,hStart);

  let agent='';
  if(admin && t==='agent') agent=agentView(vu,profiles,hist,hStart,mmOne,lastBy)+statsCard(vu,hist,hStart);

  if(admin && t==='team'){
    team=`<div class="card"><h2>Gestion de l'équipe</h2><p class="hint">Un agent est « Actif » s'il a saisi son CA au cours des 7 derniers jours. Identifiants et mots de passe : voir l'onglet Accès.</p><table><tr><th>Agent</th><th>Email</th><th>Statut</th><th>Mobile Money</th><th>Taux de commission</th><th>Rôle</th></tr>
    ${profiles.map(p=>{
      const m=mmBy[p.id];
      return `<tr><td><a href="#" onclick="pick('${p.id}');return false">${esc(p.full_name||'(sans nom)')}</a></td><td>${esc(p.email)}</td><td>${badge(lastBy[p.id])}</td>
      <td>${m&&m.number?esc(m.number)+`<small>${esc([m.operator,m.holder].filter(Boolean).join(' · '))}</small>`:'<span style="color:var(--mute)">Non renseigné</span>'}</td>
      <td><select onchange="upd('${p.id}',{commission:(+this.value||0)/100})" aria-label="Taux de commission">${rateOpts(pv(p.commission))}</select></td>
      <td><select ${p.id===me.id?'disabled title="Vous ne pouvez pas modifier votre propre rôle"':''} onchange="upd('${p.id}',{role:this.value})">
      <option value="agent" ${p.role==='agent'?'selected':''}>agent</option><option value="admin" ${p.role==='admin'?'selected':''}>admin</option></select></td></tr>`;
    }).join('')}</table>
    <h2 style="margin-top:18px">Ajouter un agent</h2><div class="row">
      <input id="ng_nm" placeholder="Nom complet"><input id="ng_em" type="email" placeholder="Adresse email"><input id="ng_pw" type="text" placeholder="Mot de passe (6 caractères min.)">
      <select id="ng_tx" title="Taux de commission" aria-label="Taux de commission">${rateOpts(5)}</select><button class="p" onclick="createAgent()">Créer le compte</button></div>
    <div id="ng_msg" class="ok">${esc(notice)}</div></div>`;
    notice='';
  }

  if(admin && t==='access'){
    access=`<div class="card"><h2>Accès et identifiants</h2>
    <p class="hint">L'identifiant de connexion est l'adresse email. Supabase chiffre toujours le mot de passe réel de connexion (cela ne se modifie pas) ; la colonne ci-dessous affiche en clair le mot de passe que vous avez défini à la création du compte ou noté vous-même, visible uniquement par l'administrateur. Si l'agent change son mot de passe, cette valeur n'est plus à jour : envoyez-lui plutôt un lien de réinitialisation.</p>${credOk?'':'<p class="msg">Table agent_credentials absente : exécutez le SQL fourni dans Supabase pour afficher les mots de passe.</p>'}
    <table><tr><th>Agent</th><th>Identifiant (email)</th><th>Mot de passe</th><th>Statut</th><th>Action</th></tr>
    ${profiles.map(p=>`<tr><td>${esc(p.full_name||'(sans nom)')}</td>
      <td>${esc(p.email)} <button type="button" data-t="${esc(p.email)}" onclick="copyTxt(this)">Copier</button></td>
      <td>${!credOk?'<span style="color:var(--mute)">—</span>':credBy[p.id]?`<code>${esc(credBy[p.id])}</code> <button type="button" data-t="${esc(credBy[p.id])}" onclick="copyTxt(this)">Copier</button>`:`<input id="cr_${p.id}" placeholder="Mot de passe connu" style="width:150px"> <button type="button" data-u="${p.id}" data-t="${esc(p.email)}" onclick="noteCred(this)">Noter</button>`}</td><td>${badge(lastBy[p.id])}</td>
      <td><button type="button" data-u="${p.id}" data-t="${esc(p.email)}" onclick="resetPw(this)">Envoyer un lien de réinitialisation</button></td></tr>`).join('')}</table>
    <p class="hint" style="margin-top:10px">Pour que le lien ramène l'agent sur cette page, renseignez l'adresse de votre site dans Supabase : Authentication › URL Configuration › Site URL.</p></div>`;
  }

  let goalsTab='';
  if(admin && t==='goals'){
    const o=objData(goals||[],rows,tr);
    const trs=(goals||[]).map(g=>{
      const k=mkey(g.name), gl=Number(g.daily_goal||0), td=o.td[k]||0, w=o.wk[k]||0;
      return `<tr><td>${esc(g.name)}</td>
        <td><input type="text" inputmode="decimal" style="width:100px" value="${gl}" onchange="setGoal('${g.id}',this.value)" aria-label="Objectif journalier"></td>
        <td>${fmt(td)}</td><td style="min-width:130px">${gl>0?pbar(td,gl):''}</td><td>${gl>0?stBadge(td,gl):'—'}</td>
        <td>${fmt(w)} / ${fmt(gl*7)}</td>
        <td><button type="button" data-id="${g.id}" data-n="${esc(g.name)}" onclick="delModel(this)" aria-label="Retirer le modèle" title="Retirer">✕</button></td></tr>`;
    }).join('');
    goalsTab=cuCard(cu,cuOk,cuCA)+agencyCard(o)+`<div class="card"><h2>Ajouter un modèle et son objectif journalier</h2>
    <p class="hint">Les agents ne peuvent que choisir un modèle dans cette liste : ajoutez ici chaque modèle une seule fois, c'est la seule source des noms (plus de fautes de frappe). Réutiliser un nom existant met à jour son objectif.</p>
    <div class="row"><input id="md_nm" placeholder="Nom du modèle"><input id="md_g" inputmode="decimal" placeholder="Objectif journalier (CA)"><button class="p" onclick="addModel()">Ajouter le modèle</button></div>
    <div id="md_msg" class="ok">${esc(notice)}</div></div>`;
    notice='';
    goalsTab+= goals===null
      ? `<div class="card"><p class="msg">Table « models » absente : exécutez le SQL fourni dans Supabase pour activer les objectifs.</p></div>`
      : `${(o.dayGoal||o.weekGoal)?objTiles(o):''}
    <div class="card"><h2>Suivi des objectifs par modèle</h2>
    <p class="hint">Le CA du jour correspond à la date d'aujourd'hui ; le CA de la semaine à la semaine affichée. Les objectifs par modèle servent de repère et de valeur par défaut pour l'agence quand aucun objectif n'a été fixé pour un jour.</p>
    ${trs?`<table><tr><th>Modèle</th><th>Objectif / jour</th><th>CA aujourd'hui</th><th>Progression</th><th>Statut</th><th>Semaine : CA / objectif</th><th></th></tr>${trs}
    <tfoot><tr><td>Total agence</td><td>${fmt(o.dayGoal)}</td><td>${fmt(o.tTot)}</td><td style="min-width:130px">${pbar(o.tTot,o.dayGoal)}</td><td>${o.dayGoal?stBadge(o.tTot,o.dayGoal):'—'}</td><td>${fmt(o.wTot)} / ${fmt(o.weekGoal)}</td><td></td></tr></tfoot></table>`:'<p class="hint">Aucun modèle pour le moment. Ajoutez-en un ci-dessus.</p>'}</div>`;
  }

  const nav=admin?`<div class="nav">${[['dash','📊 Tableau de bord'],['agent','👤 Agents'],['goals','🎯 Objectifs'],['team','👥 Équipe'],['access','🔑 Accès']]
    .map(([k,l])=>`<button class="${t===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`:'';

  const weekBar=(t==='team'||t==='access')?'':`<div class="card"><div class="row">
    <button onclick="shift(-1)" aria-label="Semaine précédente">◀</button>
    <input type="date" value="${from}" onchange="pickWeek(this.value)" aria-label="Choisir une semaine">
    <button onclick="shift(1)" aria-label="Semaine suivante">▶</button>
    <span style="color:var(--mute)">Semaine du ${days[0].toLocaleDateString('fr-FR')} au ${days[6].toLocaleDateString('fr-FR')}</span></div></div>`;

  const first=esc((vu.full_name||vu.email||'').split(/[ @]/)[0]);
  const report=(admin||t!=='reports')?'':`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Rapport de shift — ${esc(vu.full_name||vu.email)}</h2>
  </div>
  <p class="hello">${vu.id===me.id?`${greet()} <b>${first}</b> 👋 Renseignez votre activité jour par jour.`:`Vous consultez le rapport de <b>${first}</b>.`}</p>
  <p class="hint">Pour chaque jour, ajoutez une ligne par modèle : choisissez le modèle dans la liste, puis indiquez le chiffre d'affaires et un détail éventuel. Les totaux se calculent automatiquement. Laissez un jour vide en l'absence d'activité.</p>
  ${MODEL_NAMES.length?'':'<p class="msg">Aucun modèle disponible pour le moment : demandez à l\'administrateur d\'en ajouter dans l\'onglet Objectifs.</p>'}
  <div class="lh${HAS_DETAIL?'':' nd'}"><span>Modèle</span><span>Chiffre d'affaires</span>${HAS_DETAIL?'<span>Détail</span>':''}<span></span></div>
  ${days.map(d=>{
    const k=iso(d), r=mine[k]||{models:[]};
    return `<div class="day"><div class="dh"><span>${dayName(d)}</span><span>CA du jour : <b id="dayca_${k}">0</b></span></div>
      <div id="ln_${k}">${r.models.map(lineHtml).join('')}</div>
      <button type="button" onclick="addLine('${k}')">＋ Ajouter un modèle</button></div>`;
  }).join('')}
  <div class="tot"><div><span>CA total de la semaine</span><b id="tca">0</b></div></div>
  <div class="row" style="margin-top:12px"><button class="p" onclick="save('${vu.id}')">Enregistrer la semaine</button><span id="sm"></span></div></div>
  ${statsCard(vu,hist,hStart)}${mmCard(vu,mmOne)}`;

  lastRefresh=new Date();
  $('app').innerHTML=`<header><div class="brand"><span class="logo">SR</span><div><h1>Shift Report</h1><small>Suivi des ventes et des commissions</small></div></div>
  <div class="row"><span>${esc(me.full_name||me.email)} · ${me.role}</span><button onclick="logout()">Déconnexion</button></div></header>
  ${nav}${weekBar}${dash}${agent}${report}${goalsTab}${team}${access}`;
  if(t==='reports'&&!admin) calc();
}

function statsCard(vu,rows,hStart){
  const weeks=weekSeries(rows,hStart);
  const daily={};
  rows.forEach(r=>{ daily[r.day]=(daily[r.day]||0)+Number(r.ca||0); });
  let best=null,worked=0;
  Object.entries(daily).forEach(([day,ca])=>{
    if(ca>0) worked++;
    if(!best||ca>best.ca) best={day,ca};
  });
  const tot=weeks.reduce((s,w)=>s+w.ca,0);
  const active=weeks.filter(w=>w.ca>0).length;
  const co=tot*vu.commission;
  const evo=evoOf(weeks[STAT_WEEKS-1].ca,weeks[STAT_WEEKS-2].ca);

  return `<div class="card"><h2>Performance — ${esc(vu.full_name||vu.email)}</h2>
  <p class="hint">Évolution sur les ${STAT_WEEKS} dernières semaines, jusqu'à la semaine affichée.</p>
  <div class="tiles">
    <div><span>CA cumulé (${STAT_WEEKS} semaines)</span><b>${fmt(tot)}</b></div>
    <div><span>Moyenne par semaine active</span><b>${fmt(active?tot/active:0)}</b></div>
    <div><span>Évolution hebdomadaire</span><b class="${evoCls(evo)}">${evoTxt(evo)}</b></div>
    <div><span>Meilleure journée</span><b>${best&&best.ca>0?fmt(best.ca):'—'}</b>${best&&best.ca>0?`<span>${dayShort(new Date(best.day+'T00:00:00'))}</span>`:''}</div>
    <div><span>Jours d'activité</span><b>${worked}</b></div>
    ${me.role==='admin'?`<div><span>Commission estimée</span><b>${fmt(co)}</b><span>${fmt(co*AR_MULT)} Ar</span></div>`:''}
  </div>${bars(weekItems(weeks),'CA par semaine sur '+STAT_WEEKS+' semaines')}</div>`;
}

function mmCard(vu,m){
  m=m||{};
  const ops=MM_OPS.includes(m.operator)||!m.operator?MM_OPS:[...MM_OPS,m.operator];
  return `<div class="card mm"><h2>Versement des commissions (Mobile Money)</h2>
  <p class="hint">Numéro sur lequel la commission doit être versée.</p>
  <div class="row" style="align-items:flex-end">
    <label>Opérateur<select id="mm_op"><option value="">— Choisir —</option>${ops.map(o=>`<option ${o===m.operator?'selected':''}>${esc(o)}</option>`).join('')}</select></label>
    <label>Numéro<input id="mm_nb" type="tel" inputmode="tel" placeholder="034 00 000 00" value="${esc(m.number||'')}"></label>
    <label>Titulaire du compte<input id="mm_ho" placeholder="Nom figurant sur le compte" value="${esc(m.holder||'')}"></label>
    <button class="p" onclick="saveMM('${vu.id}')">Enregistrer</button></div>
  <div id="mm_msg"></div></div>`;
}

async function saveMM(uid){
  const el=$('mm_msg');
  try{
    await mmApi('PUT','',{user_id:uid,operator:$('mm_op').value,number:$('mm_nb').value,holder:$('mm_ho').value});
    el.className='ok'; el.textContent='Coordonnées Mobile Money enregistrées.';
  }catch(e){
    el.className='msg'; el.textContent='Erreur : '+e.message;
  }
}

function calc(){
  let ca=0;
  days.forEach(d=>{
    const k=iso(d);
    let daily=0;
    $('ln_'+k).querySelectorAll('.c').forEach(i=>{ const v=num(i.value); if(i.value.trim() && Number.isFinite(v) && v>0) daily+=v; });
    ca+=daily;
    $('dayca_'+k).textContent=fmt(daily);
  });
  $('tca').textContent=fmt(ca);
}

async function save(uid){
  const status=$('sm');
  const fail=t=>{ status.className='msg'; status.textContent=t; };
  let desired=[];
  for(const d of days){
    const k=iso(d);
    try{
      readDay(k).forEach(m=>{
        const row={user_id:uid,day:k,model_name:m.model_name,ca:m.ca};
        if(HAS_DETAIL) row.detail=m.detail||null;
        desired.push(row);
      });
    }catch(e){ return fail(`${dayName(d)} : ${e.message}`); }
  }
  const from=iso(days[0]),to=iso(days[6]);
  const {data:existing,error:readError}=await sb.from('model_entries')
    .select('day,model_name').eq('user_id',uid).gte('day',from).lte('day',to);
  if(readError) return fail('Erreur : '+readError.message);
  if(desired.length){
    const {error}=await sb.from('model_entries').upsert(desired,{onConflict:'user_id,day,model_name'});
    if(error) return fail('Erreur : '+error.message);
  }
  const wanted=new Set(desired.map(r=>`${r.day}\u0000${r.model_name}`));
  const stale=(existing||[]).filter(r=>!wanted.has(`${r.day}\u0000${r.model_name}`));
  for(const r of stale){
    const {error}=await sb.from('model_entries').delete()
      .eq('user_id',uid).eq('day',r.day).eq('model_name',r.model_name);
    if(error) return fail('Erreur : '+error.message);
  }
  await show();
  const st=$('sm');
  if(st){
    st.className='ok';
    st.textContent='Rapport enregistré avec succès.';
  }
}

async function upd(id,patch){
  const {error}=await sb.from('profiles').update(patch).eq('id',id);
  if(error) alert('Erreur : '+error.message);
  show();
}

async function createAgent(){
  const nm=$('ng_nm').value.trim(), em=$('ng_em').value.trim(), pw=$('ng_pw').value;
  const tx=(+$('ng_tx').value||5)/100, m=$('ng_msg');
  m.className='msg';
  if(!(tx>=0&&tx<=1)){
    m.textContent='Le taux doit être un pourcentage compris entre 0 et 100.';
    return;
  }
  if(!nm||!em||pw.length<6){
    m.textContent='Veuillez renseigner le nom, l’email et un mot de passe de 6 caractères minimum.';
    return;
  }
  const {data,error}=await sb2.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});
  if(error){
    m.textContent='Création impossible : '+error.message;
    return;
  }
  if(!data.user||(data.user.identities&&data.user.identities.length===0)){
    m.textContent='Cette adresse email est déjà utilisée.';
    return;
  }
  await sb.from('profiles').update({commission:tx}).eq('id',data.user.id);
  const {error:ce}=await sb.from('agent_credentials').upsert({user_id:data.user.id,email:em,password:pw},{onConflict:'user_id'});
  notice='Compte créé pour '+nm+'. L’agent se connecte avec cet email et ce mot de passe.'+(ce?' Le mot de passe n’a pas pu être noté dans l’onglet Accès (table agent_credentials manquante).':'')
    +(data.session?'':' Attention : la confirmation par email est active dans Supabase. L’agent doit confirmer son email, ou désactivez « Confirm email » dans Supabase.');
  show();
}

// Actualisation automatique (suivi des objectifs en quasi temps réel)
setInterval(()=>{
  const a=document.activeElement;
  if(me && me.role==='admin' && (tab==='dash'||tab==='goals') && !recovering && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) show();
},30000);

start();
</script>
