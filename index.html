<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift Report</title>
<style>
:root{--bg:#eef1f4;--ink:#1b2430;--mute:#5d6b7a;--line:#d3dae1;--acc:#1f6f5c;--card:#fff;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141a20;--ink:#e6ebf0;--mute:#93a1b0;--line:#2c3742;--acc:#4fb79e;--card:#1c242c;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;overflow-x:auto}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input[type=number]{width:110px}input.t{width:100%;min-width:180px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{color:var(--mute);font-weight:600}tfoot td{font-weight:700}
td small{display:block;color:var(--mute);white-space:normal;max-width:130px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--mute)}.sw input{width:auto;margin:0}
.tot{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}.tot div span{display:block;color:var(--mute);font-size:13px}.tot b{font-size:18px}
.msg{color:var(--err);margin-top:8px}.ok{color:var(--acc);margin-top:8px}.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
.auth{max-width:340px;margin:8vh auto}.auth input{width:100%;margin-bottom:8px}
.hello{font-size:15px;margin:0 0 6px}.hello b{color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tiles div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}.tiles span{display:block;color:var(--mute);font-size:13px}.tiles b{font-size:18px}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mute);font-size:11px}.chart .v{fill:var(--ink);font-weight:600}
.chart .bar{fill:var(--acc);opacity:.45}.chart .bar.cur{opacity:1}.chart .grid{stroke:var(--line)}
.meter{display:inline-block;width:70px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
.up{color:var(--acc)}.down{color:var(--err)}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:22px 0 10px}
.mm label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== À MODIFIER =====
const SUPABASE_URL = 'https://gnhvvhjnfsetopbekqcp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TTbtSYdZF5PXJIAZiwsAkQ_3CcoAzIw';
const AR_MULT = 3900;   // Ar = Commission x 3900 (comme dans ton Excel)
// ======================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// 2e client sans session : sert uniquement à créer le compte d'un agent sans déconnecter l'admin
const sb2 = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'sr-tmp'}});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monday = d => { const x = new Date(d); x.setDate(x.getDate() - (x.getDay()+6)%7); x.setHours(0,0,0,0); return x; };
const fmt = n => (Math.round(n*100)/100).toLocaleString('fr-FR');
// Le taux est stocké en décimal (0.05) mais saisi et affiché en pourcentage (5 %)
const pv = c => Math.round(Number(c||0)*1e6)/1e4;
const pct = c => pv(c).toLocaleString('fr-FR') + ' %';
// Liste déroulante du taux : 1 à 20 % (une ancienne valeur hors liste reste affichée pour ne pas être perdue)
const rateOpts = v => { const l = [...Array(20)].map((_,i)=>i+1); if(v!=null && !l.includes(v)) l.push(v); return l.sort((a,b)=>a-b).map(n=>`<option value="${n}" ${n===v?'selected':''}>${n.toLocaleString('fr-FR')} %</option>`).join(''); };
const dayName = d => d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'2-digit'});
const dayShort = d => d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'});
// Statistiques : nombre de semaines affichées dans le graphique
const STAT_WEEKS = 8;
const MM_OPS = ['MVola','Orange Money','Airtel Money'];
// Numéros Mobile Money stockés dans la table Supabase "mobile_money" (voir supabase/mobile_money.sql).
// L'ancienne route /api/mobile-money (fonction Netlify) n'existe pas sur l'hébergement actuel → 404.
const mmRow = r => r && {userId:r.user_id, operator:r.operator, number:r.number, holder:r.holder, updatedAt:r.updated_at};
async function mmApi(method, q, body){
  if(method === 'GET'){
    const uid = q ? new URLSearchParams(q).get('user_id') : null;
    let req = sb.from('mobile_money').select('*');
    if(uid) req = req.eq('user_id', uid);
    const {data, error} = await req;
    if(error) throw new Error(error.message);
    return uid ? mmRow(data[0]) || null : data.map(mmRow);
  }
  const {data:{session}} = await sb.auth.getSession();
  const number = String(body.number||'').trim().slice(0,30);
  if(number && !/^\+?[0-9 ]{6,20}$/.test(number)) throw new Error('Numéro invalide (chiffres uniquement, + autorisé).');
  const row = {user_id: body.user_id || session?.user?.id, operator:String(body.operator||'').trim().slice(0,40), number, holder:String(body.holder||'').trim().slice(0,80), updated_at:new Date().toISOString()};
  const {data, error} = await sb.from('mobile_money').upsert(row, {onConflict:'user_id'}).select().single();
  if(error) throw new Error(error.message);
  return mmRow(data);
}
// Affichage des montants en Ar : option activable / désactivable (préférence d'affichage mémorisée sur l'appareil)
let showAr = localStorage.getItem('sr-show-ar') !== '0';
function toggleAr(on){ showAr = on; localStorage.setItem('sr-show-ar', on?'1':'0'); show(); }
const arH = () => showAr ? '<th>Ar</th>' : '';
const arC = v => showAr ? `<td>${fmt(v)}</td>` : '';
const arS = v => showAr ? `<span>${fmt(v)} Ar</span>` : '';
const greet = () => new Date().getHours() < 18 ? 'Bonjour' : 'Bonsoir';
let me = null, viewId = null, weekStart = monday(new Date()), days = [], notice = '', page = 'report';
function setPage(p){ page = p; window.scrollTo(0,0); show(); }

async function authView(msg, mode){
  const {data:has} = await sb.rpc('has_users');
  const first = has === false, reg = first || mode === 'signup';
  $('app').innerHTML = `<div class="card auth"><h1>Shift Report</h1>
  <p style="color:var(--mute)">${first?'Première utilisation : crée le compte administrateur.':reg?'Crée ton compte agent. Ton administrateur pourra ensuite régler ton taux de commission.':'Connecte-toi avec ton compte.'}</p>
  ${reg?'<input id="nm" placeholder="Nom complet" autocomplete="name">':''}
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="${reg?'new-password':'current-password'}">
  ${reg&&!first?'<input id="pw2" type="password" placeholder="Confirme le mot de passe" autocomplete="new-password">':''}
  <div class="row">${first?'<button class="p" onclick="signup()">Créer le compte administrateur</button>':reg?'<button class="p" onclick="signup()">Créer mon compte</button>':'<button class="p" onclick="login()">Se connecter</button>'}</div>
  ${first?'':`<p class="hint" style="margin-top:12px">${reg?'Déjà un compte ? <a href="#" onclick="authView(\'\',\'login\');return false">Se connecter</a>':'Pas encore de compte ? <a href="#" onclick="authView(\'\',\'signup\');return false">Créer un compte</a>'}</p>`}
  <div class="msg" id="am">${msg||''}</div></div>`;
}
async function login(){
  const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error) $('am').textContent = 'Connexion impossible : ' + error.message; else start();
}
async function signup(){
  const nm=$('nm').value.trim(), em=$('em').value.trim(), pw=$('pw').value, am=$('am');
  if(!nm||!em||pw.length<6) return am.textContent = 'Renseigne ton nom, ton email et un mot de passe de 6 caractères minimum.';
  if($('pw2') && $('pw2').value !== pw) return am.textContent = 'Les deux mots de passe ne correspondent pas.';
  const {data,error} = await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});
  if(error) return am.textContent = 'Inscription impossible : ' + error.message;
  if(data.user && data.user.identities && data.user.identities.length===0) return am.textContent = 'Cet email est déjà utilisé. Connecte-toi plutôt.';
  if(!data.session) authView('<span class="ok">Compte créé. Confirme ton email via le lien reçu, puis connecte-toi.</span>', 'login'); else start();
}
async function logout(){ await sb.auth.signOut(); me = null; viewId = null; authView(); }

async function start(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return authView();
  const {data,error} = await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!data) return authView(esc('Profil introuvable : ' + (error?error.message:'')));
  me = data; viewId = viewId || me.id; show();
}

function shift(n){ weekStart.setDate(weekStart.getDate()+n*7); show(); }
function pickWeek(v){ if(v){ weekStart = monday(new Date(v+'T00:00:00')); show(); } }
function pick(id){ viewId = id; page = 'report'; show(); }

function topBar(){
  const nav = me.role !== 'admin' ? '' : page === 'stats'
    ? `<button onclick="setPage('report')">← Retour aux rapports</button>`
    : `<button class="p" onclick="setPage('stats')">Statistiques globales</button>`;
  return `<header><h1>Shift Report${page==='stats'?' — Statistiques':''}</h1><div class="row">${nav}<label class="sw"><input type="checkbox" ${showAr?'checked':''} onchange="toggleAr(this.checked)"> Afficher Ar</label><span>${esc(me.full_name||me.email)} (${me.role})</span><button onclick="logout()">Déconnexion</button></div></header>`;
}
function weekNav(){
  return `<div class="card"><div class="row">
    <button onclick="shift(-1)" aria-label="Semaine précédente">◀</button>
    <input type="date" value="${iso(days[0])}" onchange="pickWeek(this.value)" aria-label="Choisir une semaine">
    <button onclick="shift(1)" aria-label="Semaine suivante">▶</button>
    <span style="color:var(--mute)">${days[0].toLocaleDateString('fr-FR')} au ${days[6].toLocaleDateString('fr-FR')}</span></div></div>`;
}

async function show(){
  days = [...Array(7)].map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d;});
  if(page === 'stats' && me.role === 'admin') return showStats();
  page = 'report';
  const from = iso(days[0]), to = iso(days[6]), admin = me.role === 'admin';
  let profiles = [me], all = [];
  if(admin){
    const [p,e] = await Promise.all([sb.from('profiles').select('*').order('full_name'), sb.from('entries').select('*').gte('day',from).lte('day',to)]);
    profiles = p.data || [me]; all = e.data || [];
  } else {
    const e = await sb.from('entries').select('*').eq('user_id',me.id).gte('day',from).lte('day',to); all = e.data || [];
  }
  if(!admin || !profiles.find(p=>p.id===viewId)) viewId = me.id;
  const vu = profiles.find(p=>p.id===viewId) || me;
  const hStart = new Date(weekStart); hStart.setDate(hStart.getDate() - (STAT_WEEKS-1)*7);
  const [hist, mmAll, mmOne] = await Promise.all([
    sb.from('entries').select('day,ca').eq('user_id',vu.id).gte('day',iso(hStart)).lte('day',to),
    admin ? mmApi('GET').catch(()=>[]) : Promise.resolve([]),
    mmApi('GET','?user_id='+encodeURIComponent(vu.id)).catch(()=>null)
  ]);
  const mmBy = {}; (mmAll||[]).forEach(m=>{ mmBy[m.userId] = m; });
  const byU = {}; all.forEach(r=>{ (byU[r.user_id] = byU[r.user_id] || {})[r.day] = r; });
  const mine = byU[vu.id] || {};

  let recap = '', team = '';
  if(admin){
    let gCa=0, gCo=0, gAr=0;
    const body = profiles.map(p=>{
      const u = byU[p.id] || {}; const ca = days.reduce((s,d)=>s+Number((u[iso(d)]||{}).ca||0),0);
      const co = ca*p.commission, ar = co*AR_MULT; gCa+=ca; gCo+=co; gAr+=ar;
      return `<tr><td><a href="#" onclick="pick('${p.id}');return false">${esc(p.full_name||p.email)}</a></td>
      ${days.map(d=>{const r=u[iso(d)];return `<td>${r?fmt(r.ca)+(r.modelle?`<small>${esc(r.modelle)}</small>`:''):''}</td>`}).join('')}
      <td><b>${fmt(ca)}</b></td><td>${pct(p.commission)}</td><td>${fmt(co)}</td>${arC(ar)}</tr>`;
    }).join('');
    recap = `<div class="card"><h2>Tous les rapports — semaine du ${days[0].toLocaleDateString('fr-FR')}</h2>
    <p class="hint">Clique sur un nom pour ouvrir et modifier son rapport.</p><table>
    <tr><th>Agent</th>${days.map(d=>`<th>${dayShort(d)}</th>`).join('')}<th>CA</th><th>Taux</th><th>Commission</th>${arH()}</tr>${body}
    <tfoot><tr><td>Total</td><td colspan="7"></td><td>${fmt(gCa)}</td><td></td><td>${fmt(gCo)}</td>${arC(gAr)}</tr></tfoot></table></div>`;
    team = `<div class="card"><h2>Gestion de l'équipe</h2><table><tr><th>Agent</th><th>Email</th><th>Mobile Money</th><th>Taux</th><th>Rôle</th></tr>
    ${profiles.map(p=>{const m=mmBy[p.id];return `<tr><td>${esc(p.full_name||'(sans nom)')}</td><td>${esc(p.email)}</td>
      <td>${m&&m.number?esc(m.number)+`<small>${esc([m.operator,m.holder].filter(Boolean).join(' · '))}</small>`:'<span style="color:var(--mute)">—</span>'}</td>
      <td><select onchange="upd('${p.id}',{commission:(+this.value||0)/100})" aria-label="Taux de commission">${rateOpts(pv(p.commission))}</select></td>
      <td><select ${p.id===me.id?'disabled title="Tu ne peux pas changer ton propre rôle"':''} onchange="upd('${p.id}',{role:this.value})">
      <option value="agent" ${p.role==='agent'?'selected':''}>agent</option><option value="admin" ${p.role==='admin'?'selected':''}>admin</option></select></td></tr>`}).join('')}</table>
    <h2 style="margin-top:18px">Créer un compte agent</h2><div class="row">
      <input id="ng_nm" placeholder="Nom complet"><input id="ng_em" type="email" placeholder="Email"><input id="ng_pw" type="text" placeholder="Mot de passe (6 min.)">
      <select id="ng_tx" title="Taux de commission" aria-label="Taux de commission">${rateOpts(5)}</select><button class="p" onclick="createAgent()">Créer le compte</button></div>
    <div id="ng_msg" class="ok">${esc(notice)}</div></div>`;
    notice = '';
  }

  $('app').innerHTML = `${topBar()}${weekNav()}
  ${recap}
  <div class="card"><h2>Shift report — ${esc(vu.full_name||vu.email)}</h2>
  <p class="hello">${greet()} <b>${esc((vu.full_name||vu.email||'').split(/[ @]/)[0])}</b> 👋 Bienvenue sur ton shift report !</p>
  <p class="hint">Prends quelques instants pour bien remplir ton formulaire : note le total de chaque journée dans « CA » et le détail dans « Modelle » (ex. E250,C75, nom du modèle, OFF…), vérifie ton taux de commission puis clique sur « Enregistrer la semaine ». Merci et bon shift !</p>
  <table><tr><th>Jour</th><th>CA</th><th>Modelle</th></tr>
  ${days.map(d=>{const k=iso(d),r=mine[k]||{};return `<tr><td style="text-transform:capitalize">${dayName(d)}</td>
    <td><input type="number" step="any" min="0" id="ca_${k}" value="${r.ca??''}" oninput="calc()"></td>
    <td><input class="t" id="mo_${k}" value="${esc(r.modelle||'')}" placeholder="Détail / modèle"></td></tr>`}).join('')}</table>
  <div class="tot">
    <div><span>CA de la semaine</span><b id="tca">0</b></div><div><span>Taux</span><select id="rate" onchange="calc()" aria-label="Taux de commission">${rateOpts(pv(vu.commission))}</select></div>
    <div><span>Commission</span><b id="tco">0</b></div>${showAr?'<div><span>Ar</span><b id="tar">0</b></div>':''}</div>
  <div class="row" style="margin-top:12px"><button class="p" onclick="save('${vu.id}')">Enregistrer la semaine</button><span id="sm"></span></div></div>
  ${statsCard(vu, hist.data||[], hStart)}
  ${mmCard(vu, mmOne)}${team}`;
  calc();
}

function statsCard(vu, rows, hStart){
  const weeks = [...Array(STAT_WEEKS)].map((_,i)=>{const d=new Date(hStart);d.setDate(d.getDate()+i*7);return {d,ca:0};});
  const byDay = {}; rows.forEach(r=>{ byDay[r.day] = Number(r.ca||0); });
  let best = null, worked = 0;
  rows.forEach(r=>{ const ca=Number(r.ca||0); const i=Math.floor((new Date(r.day+'T00:00:00')-hStart)/(7*864e5)); if(weeks[i]) weeks[i].ca+=ca; if(ca>0) worked++; if(!best||ca>best.ca) best={day:r.day,ca}; });
  const tot = weeks.reduce((s,w)=>s+w.ca,0), active = weeks.filter(w=>w.ca>0).length, co = tot*vu.commission;
  const cur = weeks[weeks.length-1].ca, prev = weeks[weeks.length-2]?weeks[weeks.length-2].ca:0;
  const evo = prev>0 ? Math.round((cur-prev)/prev*100) : null;
  // Graphique en barres (SVG) : CA par semaine, la semaine affichée en couleur pleine
  const W=640,H=200,pl=8,pr=8,pt=22,pb=28, max=Math.max(...weeks.map(w=>w.ca),1);
  const bw=(W-pl-pr)/weeks.length, ih=H-pt-pb;
  const bars = weeks.map((w,i)=>{const h=w.ca/max*ih, x=pl+i*bw+bw*.18, y=pt+ih-h, last=i===weeks.length-1;
    return `<g><title>Semaine du ${w.d.toLocaleDateString('fr-FR')} : ${fmt(w.ca)}</title>
    <rect class="bar${last?' cur':''}" x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,w.ca>0?2:0)}" rx="3"></rect>
    ${w.ca>0?`<text class="v" x="${x+bw*.32}" y="${y-6}" text-anchor="middle">${fmt(w.ca)}</text>`:''}
    <text x="${x+bw*.32}" y="${H-10}" text-anchor="middle">${w.d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</text></g>`;}).join('');
  return `<div class="card"><h2>Statistiques — ${esc(vu.full_name||vu.email)}</h2>
  <p class="hint">Les ${STAT_WEEKS} dernières semaines jusqu'à la semaine affichée.</p>
  <div class="tiles">
    <div><span>CA sur ${STAT_WEEKS} semaines</span><b>${fmt(tot)}</b></div>
    <div><span>Moyenne / semaine active</span><b>${fmt(active?tot/active:0)}</b></div>
    <div><span>Cette semaine vs précédente</span><b>${evo===null?'—':(evo>0?'+':'')+evo+' %'}</b></div>
    <div><span>Meilleur jour</span><b>${best&&best.ca>0?fmt(best.ca):'—'}</b>${best&&best.ca>0?`<span>${dayShort(new Date(best.day+'T00:00:00'))}</span>`:''}</div>
    <div><span>Jours travaillés</span><b>${worked}</b></div>
    <div><span>Commission estimée</span><b>${fmt(co)}</b>${arS(co*AR_MULT)}</div>
  </div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="CA par semaine sur ${STAT_WEEKS} semaines">
    <line class="grid" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"></line>${bars}</svg></div>`;
}
// ===== Statistiques globales (admin) =====
const DASH_WEEKS = 12;
async function fetchAllEntries(){
  const out = [];
  for(let i=0;;i+=1000){
    const {data,error} = await sb.from('entries').select('user_id,day,ca').order('day').range(i,i+999);
    if(error) throw new Error(error.message);
    out.push(...data); if(data.length < 1000) return out;
  }
}
const evoHtml = (cur, prev) => { if(!(prev>0)) return '<span style="color:var(--mute)">—</span>'; const e=Math.round((cur-prev)/prev*100); return `<span class="${e>=0?'up':'down'}">${e>0?'+':''}${e} %</span>`; };
const meter = p => `<span class="meter" aria-hidden="true"><i style="width:${Math.min(100,Math.max(0,p))}%"></i></span>${fmt(p)} %`;
const dShort = k => k ? new Date(k+'T00:00:00').toLocaleDateString('fr-FR') : '—';
function barChart(items, aria){
  const W=640,H=200,pl=8,pr=8,pt=22,pb=28, max=Math.max(...items.map(i=>i.v),1), bw=(W-pl-pr)/items.length, ih=H-pt-pb;
  const g = items.map((it,i)=>{const h=it.v/max*ih, x=pl+i*bw+bw*.18, y=pt+ih-h;
    return `<g><title>${esc(it.title)} : ${fmt(it.v)}</title>
    <rect class="bar${it.cur?' cur':''}" x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,it.v>0?2:0)}" rx="3"></rect>
    ${it.v>0?`<text class="v" x="${x+bw*.32}" y="${y-6}" text-anchor="middle">${fmt(it.v)}</text>`:''}
    <text x="${x+bw*.32}" y="${H-10}" text-anchor="middle">${esc(it.label)}</text></g>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><line class="grid" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"></line>${g}</svg>`;
}

async function showStats(){
  $('app').innerHTML = topBar() + weekNav() + '<div class="card"><p class="hint">Chargement des statistiques…</p></div>';
  let profiles, rows;
  try{
    const [p, e] = await Promise.all([sb.from('profiles').select('*').order('full_name'), fetchAllEntries()]);
    if(p.error) throw new Error(p.error.message);
    profiles = p.data || []; rows = e;
  }catch(err){
    $('app').innerHTML = topBar() + weekNav() + `<div class="card"><p class="msg">Impossible de charger les statistiques : ${esc(err.message)}</p></div>`;
    return;
  }
  if(page !== 'stats') return;

  const from = iso(days[0]), to = iso(days[6]);
  const pS = new Date(days[0]); pS.setDate(pS.getDate()-7); const pE = new Date(days[0]); pE.setDate(pE.getDate()-1);
  const pFrom = iso(pS), pTo = iso(pE);
  const hStart = new Date(weekStart); hStart.setDate(hStart.getDate()-(DASH_WEEKS-1)*7);
  const daily = days.map((d,i)=>({label:d.toLocaleDateString('fr-FR',{weekday:'short'}), title:dayName(d), v:0, cur:true}));
  const weekly = [...Array(DASH_WEEKS)].map((_,i)=>{const d=new Date(hStart);d.setDate(d.getDate()+i*7);
    return {label:d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}), title:'Semaine du '+d.toLocaleDateString('fr-FR'), v:0, cur:i===DASH_WEEKS-1};});
  const S = {};
  profiles.forEach(p=>{ S[p.id] = {p, wCa:0, wDays:0, pCa:0, ca:0, days:0, weeks:new Set(), best:0, bestDay:null, last:null}; });
  const allWeeks = new Set(); let firstDay = null;

  rows.forEach(r=>{
    const s = S[r.user_id]; if(!s) return;
    const ca = Number(r.ca||0), k = r.day;
    if(k>=from && k<=to){ s.wCa += ca; if(ca>0) s.wDays++; daily[Math.round((new Date(k+'T00:00:00')-days[0])/864e5)].v += ca; }
    if(k>=pFrom && k<=pTo) s.pCa += ca;
    const di = Math.round((new Date(k+'T00:00:00')-hStart)/864e5);
    if(di>=0 && k<=to && weekly[Math.floor(di/7)]) weekly[Math.floor(di/7)].v += ca;
    s.ca += ca;
    if(ca>0){ const wk = iso(monday(new Date(k+'T00:00:00'))); s.days++; s.weeks.add(wk); allWeeks.add(wk); if(!s.last||k>s.last) s.last=k; if(!firstDay||k<firstDay) firstDay=k; }
    if(ca>s.best){ s.best = ca; s.bestDay = k; }
  });

  const list = Object.values(S);
  const sum = f => list.reduce((t,s)=>t+f(s),0);
  // Semaine
  const wCa = sum(s=>s.wCa), wPrev = sum(s=>s.pCa), wCo = sum(s=>s.wCa*s.p.commission);
  const wActive = list.filter(s=>s.wCa>0), wTop = [...list].sort((a,b)=>b.wCa-a.wCa)[0];
  const wBestDay = daily.reduce((b,d)=>d.v>b.v?d:b, {v:0});
  const name = s => `<a href="#" onclick="pick('${s.p.id}');return false">${esc(s.p.full_name||s.p.email)}</a>`;
  const wRows = [...list].sort((a,b)=>b.wCa-a.wCa).map((s,i)=>`<tr><td>${i+1}</td><td>${name(s)}</td><td><b>${fmt(s.wCa)}</b></td>
    <td>${meter(wCa?s.wCa/wCa*100:0)}</td><td>${s.wDays}</td><td><select onchange="upd('${s.p.id}',{commission:(+this.value||0)/100})" aria-label="Taux de commission de ${esc(s.p.full_name||s.p.email)}">${rateOpts(pv(s.p.commission))}</select></td><td>${fmt(s.wCa*s.p.commission)}</td>
    ${arC(s.wCa*s.p.commission*AR_MULT)}<td>${evoHtml(s.wCa,s.pCa)}</td></tr>`).join('');
  // Général
  const gCa = sum(s=>s.ca), gCo = sum(s=>s.ca*s.p.commission), gDays = sum(s=>s.days);
  const gRows = [...list].sort((a,b)=>b.ca-a.ca).map((s,i)=>`<tr><td>${i+1}</td><td>${name(s)}</td><td><b>${fmt(s.ca)}</b></td>
    <td>${meter(gCa?s.ca/gCa*100:0)}</td><td>${s.weeks.size}</td><td>${fmt(s.weeks.size?s.ca/s.weeks.size:0)}</td>
    <td>${s.best>0?fmt(s.best)+`<small>${dShort(s.bestDay)}</small>`:'—'}</td><td>${dShort(s.last)}</td>
    <td>${fmt(s.ca*s.p.commission)}</td>${arC(s.ca*s.p.commission*AR_MULT)}</tr>`).join('');

  $('app').innerHTML = `${topBar()}${weekNav()}
  <div class="card"><h2>Tableau de bord hebdomadaire — semaine du ${days[0].toLocaleDateString('fr-FR')}</h2>
    <p class="hint">Performance de toute l'équipe sur la semaine sélectionnée, comparée à la semaine précédente. Le taux de chaque agent reste modifiable ici à tout moment.</p>
    <div class="tiles">
      <div><span>CA de l'équipe</span><b>${fmt(wCa)}</b><span>${evoHtml(wCa,wPrev)} vs sem. préc.</span></div>
      <div><span>Commissions</span><b>${fmt(wCo)}</b>${arS(wCo*AR_MULT)}</div>
      <div><span>Agents actifs</span><b>${wActive.length} / ${list.length}</b></div>
      <div><span>Moyenne / agent actif</span><b>${fmt(wActive.length?wCa/wActive.length:0)}</b></div>
      <div><span>Meilleur agent</span><b>${wTop&&wTop.wCa>0?fmt(wTop.wCa):'—'}</b><span>${wTop&&wTop.wCa>0?esc(wTop.p.full_name||wTop.p.email):''}</span></div>
      <div><span>Meilleur jour</span><b>${wBestDay.v>0?fmt(wBestDay.v):'—'}</b><span style="text-transform:capitalize">${wBestDay.v>0?esc(wBestDay.title):''}</span></div>
    </div>
    ${barChart(daily,'CA de l\'équipe par jour sur la semaine')}
    <p class="sec">Classement de la semaine</p>
    <table><tr><th>#</th><th>Agent</th><th>CA</th><th>Part</th><th>Jours</th><th>Taux</th><th>Commission</th>${arH()}<th>Évolution</th></tr>${wRows}
    <tfoot><tr><td></td><td>Total</td><td>${fmt(wCa)}</td><td></td><td>${sum(s=>s.wDays)}</td><td></td><td>${fmt(wCo)}</td>${arC(wCo*AR_MULT)}<td>${evoHtml(wCa,wPrev)}</td></tr></tfoot></table>
  </div>
  <div class="card"><h2>Tableau de bord général</h2>
    <p class="hint">Cumul de tous les rapports enregistrés depuis le début. Les commissions sont calculées avec le taux actuel de chaque agent.</p>
    <div class="tiles">
      <div><span>Agents inscrits</span><b>${list.length}</b></div>
      <div><span>CA total</span><b>${fmt(gCa)}</b></div>
      <div><span>Commissions totales</span><b>${fmt(gCo)}</b>${arS(gCo*AR_MULT)}</div>
      <div><span>Moyenne / semaine</span><b>${fmt(allWeeks.size?gCa/allWeeks.size:0)}</b><span>${allWeeks.size} semaine(s) active(s)</span></div>
      <div><span>Jours travaillés</span><b>${gDays}</b></div>
      <div><span>Premier rapport</span><b>${dShort(firstDay)}</b></div>
    </div>
    <p class="sec">CA de l'équipe — ${DASH_WEEKS} dernières semaines</p>
    ${barChart(weekly,'CA de l\'équipe par semaine sur '+DASH_WEEKS+' semaines')}
    <p class="sec">Classement général</p>
    <table><tr><th>#</th><th>Agent</th><th>CA total</th><th>Part</th><th>Semaines</th><th>Moy. / sem.</th><th>Meilleur jour</th><th>Dernier rapport</th><th>Commission</th>${arH()}</tr>${gRows}
    <tfoot><tr><td></td><td>Total</td><td>${fmt(gCa)}</td><td></td><td>${allWeeks.size}</td><td></td><td></td><td></td><td>${fmt(gCo)}</td>${arC(gCo*AR_MULT)}</tr></tfoot></table>
  </div>`;
}

function mmCard(vu, m){
  m = m || {};
  const ops = MM_OPS.includes(m.operator)||!m.operator ? MM_OPS : [...MM_OPS, m.operator];
  return `<div class="card mm"><h2>Mobile Money</h2>
  <p class="hint">Indique le numéro sur lequel tu veux recevoir ta commission.</p>
  <div class="row" style="align-items:flex-end">
    <label>Opérateur<select id="mm_op"><option value="">— Choisir —</option>${ops.map(o=>`<option ${o===m.operator?'selected':''}>${esc(o)}</option>`).join('')}</select></label>
    <label>Numéro<input id="mm_nb" type="tel" inputmode="tel" placeholder="034 00 000 00" value="${esc(m.number||'')}"></label>
    <label>Nom du titulaire<input id="mm_ho" placeholder="Nom sur le compte" value="${esc(m.holder||'')}"></label>
    <button class="p" onclick="saveMM('${vu.id}')">Enregistrer le numéro</button></div>
  <div id="mm_msg"></div></div>`;
}
async function saveMM(uid){
  const el = $('mm_msg');
  try{
    await mmApi('PUT','',{user_id:uid, operator:$('mm_op').value, number:$('mm_nb').value, holder:$('mm_ho').value});
    el.className='ok'; el.textContent='Numéro Mobile Money enregistré.';
  }catch(e){ el.className='msg'; el.textContent='Erreur : '+e.message; }
}
function calc(){
  let ca=0; days.forEach(d=>{ ca += +$('ca_'+iso(d)).value||0; });
  const r = (+$('rate').value||0) / 100;
  $('tca').textContent = fmt(ca); $('tco').textContent = fmt(ca*r); if($('tar')) $('tar').textContent = fmt(ca*r*AR_MULT);
}
async function save(uid){
  const up=[], del=[];
  days.forEach(d=>{const k=iso(d), ca=$('ca_'+k).value.trim(), mo=$('mo_'+k).value.trim();
    if(ca===''&&mo==='') del.push(k); else up.push({user_id:uid,day:k,ca:+ca||0,modelle:mo||null}); });
  let error = null;
  const v = +$('rate').value;
  if(!(v>0 && v<=100)){ $('sm').className='msg'; $('sm').textContent='Choisis un taux de commission dans la liste.'; return; }
  if(up.length) ({error} = await sb.from('entries').upsert(up,{onConflict:'user_id,day'}));
  if(!error && del.length) ({error} = await sb.from('entries').delete().eq('user_id',uid).in('day',del));
  if(!error) ({error} = await sb.from('profiles').update({commission:v/100}).eq('id',uid));
  await show();
  $('sm').className = error?'msg':'ok'; $('sm').textContent = error?('Erreur : '+error.message):'Enregistré.';
}
async function upd(id,patch){
  const {error} = await sb.from('profiles').update(patch).eq('id',id);
  if(error) alert('Erreur : '+error.message); show();
}
async function createAgent(){
  const nm=$('ng_nm').value.trim(), em=$('ng_em').value.trim(), pw=$('ng_pw').value, tx=(+$('ng_tx').value||5)/100, m=$('ng_msg');
  m.className='msg';
  if(!(tx>=0&&tx<=1)){ m.textContent='Le taux doit être un pourcentage entre 0 et 100.'; return; }
  if(!nm||!em||pw.length<6){ m.textContent='Renseigne le nom, l\'email et un mot de passe de 6 caractères minimum.'; return; }
  const {data,error} = await sb2.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});
  if(error){ m.textContent='Création impossible : '+error.message; return; }
  if(!data.user || (data.user.identities && data.user.identities.length===0)){ m.textContent='Cet email est déjà utilisé.'; return; }
  await sb.from('profiles').update({commission:tx}).eq('id',data.user.id);
  notice = 'Compte créé pour '+nm+'. Il se connecte avec cet email et ce mot de passe.' + (data.session?'':' Attention : la confirmation par email est active dans Supabase, l\'agent doit confirmer son email (ou désactive « Confirm email »).');
  show();
}
start();
</script>
